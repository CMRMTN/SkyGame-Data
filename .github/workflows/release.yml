name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        type: boolean
        default: true
      bump:
        description: 'Version bump before publishing (none = publish the version already in package.json)'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      deploy:
        description: 'Deploy to data.sky-planner.com'
        type: boolean
        default: true

permissions:
  id-token: write # Required for OIDC
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Configure git
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bump version
        if: inputs.publish && inputs.bump != 'none'
        run: npm version ${{ inputs.bump }}

      # Without a bump, tag the current version (unless already tagged) so it is still pushed below.
      - name: Tag current version
        if: inputs.publish && inputs.bump == 'none'
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "Tag $VERSION already exists on origin."
          else
            git tag -a "$VERSION" -m "${VERSION#v}"
          fi

      - name: Publish
        if: inputs.publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push changes
        if: inputs.publish
        run: git push --follow-tags

      # Uses the version in package.json, which is the one just published when publish is on.
      - name: Build CDN site
        if: inputs.deploy
        run: npm run cdn-build

      - name: Deploy to data.sky-planner.com
        if: inputs.deploy
        run: npm run cdn-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
